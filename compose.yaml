name: tkht-design-web
services:
  db:
    image: mysql:8.4
    environment:
      TZ: Asia/Bangkok
      MYSQL_DATABASE: garage_management
      MYSQL_USER: garage
      MYSQL_PASSWORD: ${DB_PASSWORD:-garage_dev}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-garage_root_dev}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_as_ci", "--default-time-zone=+07:00"]
    volumes:
      - design_data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./src/main/resources/db/sample-data.sql:/docker-entrypoint-initdb.d/03-sample-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1 FROM tblInvoice2 LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  app:
    build: .
    environment:
      TZ: Asia/Bangkok
      DB_URL: jdbc:mysql://db:3306/garage_management?connectionTimeZone=Asia/Bangkok&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=5000&socketTimeout=5000
      DB_USER: garage
      DB_PASSWORD: ${DB_PASSWORD:-garage_dev}
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  design_data:
